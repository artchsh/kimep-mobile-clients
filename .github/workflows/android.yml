name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install platform and build-tools
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0" > /dev/null

      - name: Enable Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('kimep-android/**/*.gradle*', 'kimep-android/gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Decode signing keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        working-directory: kimep-android
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/kimep-release.jks
          printf 'storeFile=keystore/kimep-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" \
            "${{ secrets.KEY_ALIAS }}" \
            "${{ secrets.KEY_PASSWORD }}" > keystore.properties

      - name: Build debug
        working-directory: kimep-android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build release
        working-directory: kimep-android
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify release signature
        working-directory: kimep-android
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs "$APK"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ github.sha }}
          path: |
            kimep-android/app/build/outputs/apk/debug/*.apk
            kimep-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          files: kimep-android/app/build/outputs/apk/release/*.apk
